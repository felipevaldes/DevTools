[project]
name = "devtools"
version = "2.0.0"
description = "Ubuntu Cinnamon system configuration and development tools automation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Felipe Valdes" }
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
devtools = "devtools.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtools"]

[tool.uv]
dev-dependencies = []
